name: Native builds

on:
  push:
    branches: [native-rewrite]
  pull_request:
    branches: [native-rewrite]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build Android debug APK
        run: gradle -p android assembleDebug
      - name: Run Android unit tests
        run: gradle -p android testDebugUnitTest
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: daybook-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Windows single-file app
        run: dotnet publish windows/Daybook.Windows/Daybook.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: daybook-windows-x64
          path: windows/Daybook.Windows/bin/Release/net10.0-windows/win-x64/publish/
          if-no-files-found: error
          retention-days: 14
